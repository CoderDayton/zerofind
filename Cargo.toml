[package]
name = "zerofind"
version = "0.1.0"
edition = "2024"
# globset/ignore need 1.88; CI checks this version.
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "zf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
ignore = "0.4.34"

[dev-dependencies]
tempfile = "3.27.0"

# Measured with `cgs run bench`: start 6.8 -> 4.4 ms, binary 3.0 -> 1.9 MB;
# incremental release rebuild 0.6 -> 8.5 s.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
