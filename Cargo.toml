[package]
name = "zerofind"
version = "0.1.0"
edition = "2024"
# globset/ignore need 1.88; CI checks this version.
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "zf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
ignore = "0.4.34"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3.27.0"

# vs cargo's default release profile: binary 3.19 -> 2.02 MiB, walks under 1 ms faster,
# start-up within noise; incremental release rebuild 0.6 -> 8.6 s. See docs/performance.md.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
