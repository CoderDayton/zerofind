# Loop: failing test -> `cgs run t <filter>` -> implement -> `cgs check`.
# Scripts with arguments need `cgs run <name> <arg>`; the short form forwards no arguments.

[global_env]
RUST_BACKTRACE = "1"

[scripts]

[scripts.list]
command = "cgs show"
info = "List all scripts"

[scripts.t]
command = "timeout 300 cargo test --quiet -- {{filter}}"
args = ["filter"]
info = "Run the tests whose names contain a filter (cgs run t symlink)"

[scripts.fmt]
interpreter = "bash"
command = '''
if [ "$FIX" = "1" ]; then cargo fmt; else cargo fmt --check; fi
'''
info = "Check formatting (--env FIX=1 to apply)"

[scripts.clippy]
command = "timeout 600 cargo clippy --quiet --all-targets -- -D warnings"
info = "Lint, warnings denied"

[scripts.test]
command = "timeout 600 cargo test --quiet"
info = "Full test suite"

[scripts.check]
include = ["fmt", "clippy", "test"]
info = "fmt + clippy + tests: the gate before every commit"

[scripts.check-windows]
interpreter = "bash"
command = '''
rustup target list --installed | grep -qx x86_64-pc-windows-gnu || rustup target add x86_64-pc-windows-gnu
timeout 600 cargo clippy --quiet --all-targets --target x86_64-pc-windows-gnu -- -D warnings
'''
info = "Type-check and lint every target for Windows (no linking, so no MinGW needed)"
requires = ["rustup"]

[scripts.bench]
interpreter = "bash"
command = '''
timeout 600 cargo build --quiet --release
cc -O2 -o target/peakrss benches/peakrss.c
timeout 1200 python3 -I benches/compare.py --runs "${RUNS:-10}" "{{dir}}"
'''
args = ["dir"]
info = "zf vs fd on one tree: match-set check, then wall/first-result/RSS (cgs run bench ~/src; --env RUNS=N)"
requires = ["fd", "python3"]

[scripts.bench-trees]
interpreter = "bash"
command = '''
timeout 600 cargo build --quiet --release
cc -O2 -o target/peakrss benches/peakrss.c
python3 -I benches/make_trees.py target/bench-trees >/dev/null
timeout 1200 python3 -I benches/compare.py --runs "${RUNS:-10}" --name m target/bench-trees/flat100k
timeout 1200 python3 -I benches/compare.py --runs "${RUNS:-10}" target/bench-trees/deep
'''
info = "zf vs fd on generated trees: 100k matches (flat) and 120-level nesting (deep)"
requires = ["fd", "python3"]
